    q_i: { definition: "q_i = k_i R = m q_e", note: "本 case m 一般为复数（eps_ratio 复数），q_i 相应为复数；scattering.py 的 mie_ab() 已支持复数 m/复数宗量（本 main-agent 已用 scipy.special.spherical_jn/yn 直接验证复数宗量返回正确值，diff vs jv/yv 半整数阶等价式 = 0.0，见下方 verification_note）", unit: "无量纲" }
