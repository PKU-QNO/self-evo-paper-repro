assumptions:
  - "线性、各向同性、均匀介质；球内外 ε 均为常数标量（球内 ε_i 允许复数，球外 ε_e 仍纯实）"
  - "非磁性：μ = μ_0 处处成立"
  - "ε_i/ε_e 一般为复数（Fig6 核心区别于Fig3）；不要求酉性，不能用 Fig3 的实数化捷径"
  - "外介质无吸收 Im ε_e = 0（与 Fig3 相同）"
  - "时谐约定 e^{-iωt}，散射场用 h_l^(1)（与 case 0703-01/scattering.py 一致，无需符号翻转）"
  - "经典 Mie 框架（论文 §2-§3.3）；§4 修正不在本 case 范围"
  - "无量纲化：全部物理内容由 (q_e, ε_i/ε_e) 两个量承载，R、ω、E_0 不取具体值"
  - "复用 case 0703-01 已验证的 mie_ab() 核心实现，不重新推导/不重新验证 BH 公式本身"

